<style>

    var setsN = W.ex.reduce(function (a, x) { return a + x.sets.length; }, 0);
    var prs = [], rows = '';
    TODAY.forEach(function (e, i) {
      var x = W.ex[i]; if (!x.sets.length) return;
      var top = Math.max.apply(null, x.sets.map(function (s) { return s.kg; }));
      if (top > e.best) prs.push([e.name, top, e.best]);
      var v = x.sets.reduce(function (a, s) { return a + s.kg * s.reps; }, 0), lv = e.last.kg * e.last.reps.reduce(function (a, b) { return a + b; }, 0), p = v / lv - 1;
      var reps = x.sets.every(function (s) { return s.reps === x.sets[0].reps; }) ? x.sets.length + '×' + x.sets[0].reps : x.sets.map(function (s) { return s.reps; }).join(', ');
      rows += '<div class="srow"><div class="nm"><b>' + esc(e.name) + '</b><span>' + kg(top) + ' kg · ' + reps + (x.rpe ? ' · RPE ' + x.rpe : '') + '</span></div><div class="vol"><b>' + vol(v) + ' kg</b><span class="' + (p > 0 ? 'up' : p < 0 ? 'down' : '') + '">' + (p > 0 ? '+' : '') + Math.round(p * 1000) / 10 + ' %</span> objem</div></div>';
    });
    return '<div class="bg-glow"></div><div class="scroll"><div class="sum-hero rise"><div class="medal grad">' + I.trophy + '</div><div class="eyebrow">Deň 3 · Pull · ' + mins + ' min</div><h1 class="h-xl">Tréning <span class="gtext">hotový</span></h1></div>' +
      '<div class="tiles"><div class="tile"><div class="num">' + mins + '</div><div class="k">minút</div></div><div class="tile"><div class="num">' + setsN + '</div><div class="k">sérií</div></div><div class="tile"><div class="num gtext">' + prs.length + '</div><div class="k">rekordy</div></div></div>' +
      prs.map(function (p) { return '<div class="prc grad rise">' + I.trophy + '<div><b>Nový rekord: ' + esc(p[0]) + '</b><span>' + kg(p[1]) + ' kg (doteraz ' + kg(p[2]) + ' kg)</span></div></div>'; }).join('') +
      '<div class="sec"><h3>Cviky</h3><span style="color:var(--muted);font-size:13px">objem oproti minulému týždňu</span></div><div class="card" style="padding:4px 16px">' + (rows || '<div class="srow">Žiadne zapísané série.</div>') + '</div>' +
      '<div class="card"><b>Celý tréning bol (RPE)</b><div class="rpe-row" style="margin-top:10px">' + ['6', '7', '8', '9', '10'].map(function (v) { return '<button class="' + (S.sesh === v ? 'on grad' : '') + '" data-a="sesh" data-v="' + v + '">' + v + '</button>'; }).join('') + '<span></span></div></div>' +
      '<button class="cta grad" data-a="finish" style="margin-top:6px">' + I.check + 'Uložiť do tabuľky</button></div>';
  }

  // ---------------- Udalosti ----------------
  document.addEventListener('click', function (ev) {
    var lb = ev.target.closest('.looks button'); if (lb) { setLook(lb.dataset.look); return; }
    var t = ev.target.closest('[data-a]'); if (!t) return;
    if (t.dataset.a === 'close' && t !== ev.target) return;
    var a = t.dataset.a, W = S.wo, e = W && TODAY[W.i], x = W && W.ex[W.i];
    switch (a) {
      case 'tab': S.tab = t.dataset.t; S.resetScroll = true; render(); break;
      case 'w': S.w = Math.round((S.w + Number(t.dataset.d)) * 10) / 10; render(); break;
      case 'weigh': S.weighed = true; if (navigator.vibrate) navigator.vibrate(20); render(); toast('Váha uložená do tabuľky'); break;
      case 'start': S.wo = newWorkout(); S.view = null; S.resetScroll = true; render(); break;
      case 'quit': S.wo = null; render(); toast('Tréning prerušený – zápisy ostali uložené'); break;
      case 'kg': x.cur.kg = Math.max(0, Math.round((x.cur.kg + Number(t.dataset.d) * e.step) * 100) / 100); render(); break;
      case 'reps': x.cur.reps = Math.max(1, x.cur.reps + Number(t.dataset.d)); render(); break;
      case 'set':
        x.sets.push({ kg: x.cur.kg, reps: x.cur.reps });
        if (navigator.vibrate) navigator.vibrate(30);
        if (x.cur.kg > e.best && x.sets.length === 1) toast('Nový osobný rekord! ' + kg(x.cur.kg) + ' kg');
        W.rest = { until: Date.now() + e.rest * 1000, total: e.rest };
        render(); break;
      case 'plus30': W.rest.until += 30000; W.rest.total += 30; W.rest.buzzed = false; render(); break;
      case 'skip': W.rest = null; render(); break;
      case 'rpe': x.rpe = t.dataset.v; var n = document.getElementById('exnote'); if (n) x.note = n.value; render(); break;
      case 'next':
        if (!x.rpe) { toast('Najprv ťukni RPE'); break; }
        if (W.i < TODAY.length - 1) { W.i++; W.rest = null; S.resetScroll = true; render(); } else { S.view = 'summary'; S.resetScroll = true; render(); }
        break;
      case 'sesh': S.sesh = t.dataset.v; render(); break;
      case 'finish': S.wo = null; S.view = null; S.tab = 'today'; S.resetScroll = true; render(); toast('Tréning uložený 💪'); break;
      case 'ex': S.sheet = exSheet(t.dataset.n); render(); break;
      case 'close': S.sheet = null; render(); break;
    }
  });
  document.addEventListener('input', function (ev) { if (ev.target.id === 'exnote' && S.wo) S.wo.ex[S.wo.i].note = ev.target.value; });
  render();
})();
</script>
