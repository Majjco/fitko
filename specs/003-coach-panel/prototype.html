<title>Fitko Tréner – prototyp panelu</title>

<style>
/* Plocha ako trénerov Excel: pevný stĺpec cvikov, týždne vedľa seba, posledný stĺpec = rozpracovaný týždeň. */
:root {
  --bg: #f3f5f0; --surface: #ffffff; --surface-2: #eef1ea; --line: #dde2d6; --fg: #14180f; --muted: #646d5e;
  --accent: #c8f53c; --accent-ink: #141a03; --accent-line: #7a9a12; --draft: #f7fbe6;

  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d0f12; --surface: #161a20; --surface-2: #1e232b; --line: #2a303a; --fg: #f2f4f7; --muted: #8d96a5;
  --accent: #c8f53c; --accent-ink: #141a03; --accent-line: #c8f53c; --draft: #1a2012;
  --up: #4ade80; --up-bg: #132a1b; --down: #f87171; --down-bg: #2e1616; --same: #8d96a5;
  --warn: #fbbf24; --warn-bg: #2b2210; --note: #ffb547; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d0f12; --surface: #161a20; --surface-2: #1e232b; --line: #2a303a; --fg: #f2f4f7; --muted: #8d96a5;
  --accent: #c8f53c; --accent-ink: #141a03; --accent-line: #c8f53c; --draft: #1a2012;
  --up: #4ade80; --up-bg: #132a1b; --down: #f87171; --down-bg: #2e1616; --same: #8d96a5;
  --warn: #fbbf24; --warn-bg: #2b2210; --note: #ffb547; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.45; font-variant-numeric: tabular-nums; }

button:focus-visible, input:focus-visible { outline: 2px solid var(--accent-line); outline-offset: 2px; }
.wrap { max-width: 1400px; margin: 0 auto; padding-block: 18px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
.proto { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.proto b { color: var(--fg); }
.proto button { color: var(--accent-line); font-weight: 700; }

/* Zoznam klientov */
.clients-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.clients-head h1 { font-size: 30px; }
.clients-head p { margin: 2px 0 0; color: var(--muted); }

.ccard:hover { border-color: var(--accent-line); }
.ccard-top { display: flex; gap: 12px; align-items: center; }
.avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-weight: 800; font-family: var(--head); flex: none; }
.ccard-name { font-weight: 800; font-size: 17px; }
.ccard-sub { color: var(--muted); font-size: 13px; }
.ccard-stats { display: flex; gap: 16px; font-size: 13px; color: var(--muted); }
.ccard-stats b { color: var(--fg); font-size: 15px; }
.flags { display: flex; flex-wrap: wrap; gap: 6px; }
.flag { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.flag.up { background: var(--up-bg); color: var(--up); }

/* Panel klienta */
.phead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

.snap { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0; text-align: left; }
.tile-k { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.tile-v { font-family: var(--head); font-size: 24px; font-weight: 700; }
.tile-v small { font-family: var(--sans); font-size: 13px; color: var(--muted); font-weight: 600; }
.tile-s { font-size: 12px; color: var(--muted); }
.tile-s .up { color: var(--up); font-weight: 700; } .tile-s .down { color: var(--down); font-weight: 700; }
.spark { width: 100%; height: 26px; display: block; margin-top: 2px; }
.spark path { fill: none; stroke: var(--accent-line); stroke-width: 2; }
.spark circle { fill: var(--accent-line); }
.insights { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.ins b { font-weight: 800; }
.ins.up b { color: var(--up); } .ins.down b { color: var(--down); } .ins.same b { color: var(--same); } .ins.warn b { color: var(--warn); } .ins.note b { color: var(--note); }
.ins.on { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }

/* Mriežka */
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolbar .spacer { flex: 1; }
.btn { border-radius: 10px; padding: 10px 16px; font-weight: 700; background: var(--surface); border: 1px solid var(--line); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { padding: 7px 12px; font-weight: 600; color: var(--muted); font-size: 13px; }
.seg button.on { background: var(--surface-2); color: var(--fg); }
.gridwrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; -webkit-overflow-scrolling: touch; }
table.g { border-collapse: separate; border-spacing: 0; min-width: 100%; }
.g th, .g td { border-bottom: 1px solid var(--line); padding: 0; vertical-align: top; text-align: left; }
.g thead th { position: sticky; top: 0; background: var(--surface); z-index: 2; padding: 10px 12px; font-size: 12px; color: var(--muted); font-weight: 700; white-space: nowrap; }
.g thead th b { display: block; color: var(--fg); font-family: var(--head); font-size: 15px; }
.g .ex { position: sticky; left: 0; z-index: 1; background: var(--surface); min-width: 230px; max-width: 260px; padding: 10px 12px; border-right: 1px solid var(--line); }
.g thead .ex { z-index: 3; }
.exname { font-weight: 700; text-align: left; display: block; }
.exname:hover { text-decoration: underline; text-underline-offset: 3px; }
.exmeta { display: flex; gap: 8px; align-items: center; margin-top: 4px; font-size: 12px; color: var(--muted); }
.trend { font-weight: 800; font-size: 12px; padding: 1px 7px; border-radius: 99px; white-space: nowrap; }
.trend.up { color: var(--up); background: var(--up-bg); } .trend.down { color: var(--down); background: var(--down-bg); } .trend.same { color: var(--same); background: var(--surface-2); }
.dayrow th { background: var(--surface-2); padding: 7px 12px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.dayrow th.ex { background: var(--surface-2); }
.g td.cell { min-width: 118px; padding: 9px 26px 9px 12px; position: relative; }
.cell .w { font-weight: 800; font-size: 15px; }
.cell .s { font-size: 12px; color: var(--muted); }
.cell.up .w { color: var(--up); } .cell.down .w { color: var(--down); }
.cell.plan { opacity: .55; font-style: italic; }
.cell.plan .w { font-weight: 600; }
.cell.empty { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--surface-2) 6px 7px); }
.notebtn { position: absolute; top: 7px; right: 7px; width: 18px; height: 18px; border-radius: 5px; background: var(--warn-bg); color: var(--note); font-size: 11px; font-weight: 800; display: grid; place-items: center; }
.notebtn.coach { background: var(--surface-2); color: var(--muted); right: 28px; }
tr.hl .ex, tr.hl td { background-image: linear-gradient(var(--warn-bg), var(--warn-bg)); }
tr.dim { opacity: .35; }
/* Rozpracovaný týždeň */
.g .draft { background: var(--draft); border-left: 2px solid var(--accent-line); min-width: 190px; }
.g thead th.draft { background: var(--draft); }
.dcell { padding: 7px 10px; display: grid; gap: 4px; }
.dline { display: flex; gap: 4px; align-items: center; }
.dcell input { width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 5px 6px; font: inherit; font-size: 13px; color: var(--fg); }
.dcell input.wt { font-weight: 800; font-size: 14px; }
.dcell input.chg { border-color: var(--accent-line); }
.dcell .unit { font-size: 12px; color: var(--muted); }
.why { font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: baseline; }
.why .d { font-weight: 800; }
.why .d.up { color: var(--up); } .why .d.down { color: var(--down); }
.why.rev { color: var(--warn); }
.addex { color: var(--accent-line); font-weight: 700; font-size: 13px; padding: 8px 10px; }
.nameinput { width: 100%; font-weight: 700; }
.draft-head { display: grid; gap: 4px; }
.draft-head .seg button { padding: 3px 8px; font-size: 11px; }

/* Spodná lišta */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.bar-in { max-width: 1400px; margin: 0 auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.bar-in .info { flex: 1; min-width: 200px; }
.bar-in .info b { font-family: var(--head); font-size: 16px; }
.bar-in .info span { color: var(--muted); }

/* Popover a bočný panel */
.pop { position: fixed; z-index: 40; max-width: 300px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.25); display: grid; gap: 8px; font-size: 13px; }
.pop .who { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--surface); z-index: 31; padding: calc(18px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) 18px 18px; overflow-y: auto; display: grid; gap: 14px; align-content: start; border-left: 1px solid var(--line); }
.drawer-head { display: flex; align-items: center; gap: 10px; }
.drawer-head h2 { flex: 1; font-size: 20px; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); }
.chart .axis { fill: var(--muted); font-size: 10px; }
.chart .l1 { fill: none; stroke: var(--accent-line); stroke-width: 2.5; }
.chart .l2 { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 3; }
.chart .dot { fill: var(--accent-line); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; background: var(--accent-line); vertical-align: middle; margin-right: 5px; }
.legend i.l2 { background: var(--muted); }
.notes { display: grid; gap: 8px; }
.note { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.note .who { font-size: 11px; color: var(--muted); font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 700; z-index: 50; max-width: calc(100% - 32px); }
@media (max-width: 820px) {
  .snap { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g .ex { min-width: 170px; }
}
@media (prefers-reduced-motion: no-preference) { tr { transition: opacity .2s; } }

<script>/* Fitko – výpočty objemu a návrh progresie (spoločné pre apku aj trénerov portál).
 * Čisté funkcie bez DOM: v prehliadači ako window.FitkoCalc, v Node cez require (testy).
 * Pravidlá: specs/002-next-week-suggestions/spec.md */
(function (root) {
  'use strict';

  const NUM = '\\d+(?:[.,]\\d+)?';
  const toNum = (s) => parseFloat(String(s).replace(',', '.'));
  const round2 = (n) => Math.round(n * 100) / 100;

  // ---------------------------------------------------------------------------
  // Parsovanie
  // ---------------------------------------------------------------------------
  const splitParts = (name) => String(name || '').split(/\s+\+\s+/).map((p) => p.trim()).filter(Boolean);

  // Hodnoty supersetu „2x8 a 2x9“ -> ['2x8', '2x9']. Jedna hodnota pri sériách/RPE platí
  // pre všetky časti (fill), pri váhe len pre prvú (ako graf v apke).
  function splitValues(str, n, fill) {
    const s = String(str || '').trim();
    if (n <= 1) return [s];
    const parts = s ? s.split(/\s+a\s+/i).map((p) => p.trim()) : [];
    if (parts.length <= 1) return Array.from({ length: n }, (_, i) => (i === 0 || fill ? parts[0] || '' : ''));
    return Array.from({ length: n }, (_, i) => parts[i] || '');
  }

  /*
   * Série -> { sets: [{ min, max }], extra } | { ok: true } | null
   * „2x10“, „2 × 10“, „3x8-10“, „10, 9, 8“, „10/9/8“, „2x10 + 1x8“, „1x20 BOTH“
   */
  function parseSets(str) {
    const s = String(str || '').trim();
    if (!s) return null;
    if (/^ok\.?$/i.test(s)) return { ok: true };
    const sets = [];
    let rest = s.replace(/(\d+)\s*[x×]\s*(\d+)(?:\s*[-–]\s*(\d+))?/gi, (_, n, a, b) => {
      const min = +a, max = b ? +b : +a;
      for (let i = 0; i < +n; i++) sets.push({ min: Math.min(min, max), max: Math.max(min, max) });
      return ' ';
    });
    rest = rest.replace(/(\d+)(?:\s*[-–]\s*(\d+))?/g, (_, a, b) => {
      const min = +a, max = b ? +b : +a;
      sets.push({ min: Math.min(min, max), max: Math.max(min, max) });
      return ' ';
    });
    if (!sets.length || sets.length > 20) return null;
    const extra = rest.replace(/[+,;]/g, ' ').replace(/\s+/g, ' ').replace(/^[\s/]+$/, '').trim();
    return { sets, extra };
  }

  // „8“ -> [8, 8]; „7-8“ -> [7, 8]; „7,5“ -> [7.5, 7.5]
  function parseRpe(str) {
    const m = String(str || '').match(new RegExp(`(${NUM})(?:\\s*[-–]\\s*(${NUM}))?`));
    if (!m) return null;
    const a = toNum(m[1]), b = m[2] ? toNum(m[2]) : a;
    if (!(a > 0 && a <= 10 && b > 0 && b <= 10)) return null;
    return [Math.min(a, b), Math.max(a, b)];
  }

  // „47,5“ -> { lo: 47.5, hi: 47.5, comma: true }; „40-45 kg“ -> rozsah; „CHOOSE“ -> { choose }
  function parseWeight(str) {
    const s = String(str || '').trim();
    if (!s) return null;
    if (/choose|podľa seba/i.test(s)) return { choose: true };
    const m = s.match(new RegExp(`^(${NUM})(?:\\s*[-–]\\s*(${NUM}))?\\s*(?:kg)?$`, 'i'));
    if (m) {
      const lo = toNum(m[1]), hi = m[2] ? toNum(m[2]) : lo;
      return { lo: Math.min(lo, hi), hi: Math.max(lo, hi), comma: s.includes(','), exact: true };
    }
    const clean = s.replace(/\d+\s*[x×]\s*(?=\d)/gi, '');
    const n = clean.match(new RegExp(NUM));
    return n ? { lo: toNum(n[0]), hi: toNum(n[0]), comma: s.includes(','), exact: false } : null;
  }

  const hasAny = (f) => Boolean(f && (String(f.sets || '').trim() || String(f.weight || '').trim() || String(f.rpe || '').trim()));
  const sum = (a) => a.reduce((x, y) => x + y, 0);

  // ---------------------------------------------------------------------------
  // Formátovanie
  // ---------------------------------------------------------------------------
  function fmtNum(n, comma) {
    const s = String(round2(n));
    return comma ? s.replace('.', ',') : s;
  }
  // Objem pre ľudí: 1350 -> „1 350“, 562.5 -> „562,5“
  function formatVolume(v) {
    const r = Math.round(v * 10) / 10;
    const [i, d] = String(r).split('.');
    return i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + (d ? ',' + d : '');
  }
  function formatPct(p) {
    const r = Math.round(p * 1000) / 10;
    if (r === 0) return '±0 %';
    return `${r > 0 ? '+' : '−'}${String(Math.abs(r)).replace('.', ',')} %`;
  }
  const fmtKg = (n) => String(round2(n)).replace('.', ',');
  function formatSets(count, min, max, extra) {
    const reps = max > min ? `${min}-${max}` : `${min}`;
    const ex = extra ? (extra.startsWith('/') ? extra : ' ' + extra) : '';
    return `${count}x${reps}${ex}`;
  }

  // ---------------------------------------------------------------------------
  // Objem
  // ---------------------------------------------------------------------------
  // Opakovania odcvičených sérií; „Ok“ = podľa plánu (spodná hranica rozsahu).
  function doneReps(doneSets, planSets) {
    const d = parseSets(doneSets);
    if (!d) return null;
    if (d.ok) {
      const p = parseSets(planSets);
      return p && !p.ok ? p.sets.map((x) => x.min) : null;
    }
    return d.sets.map((x) => x.min);
  }

  // Objem jednej časti: { value, unit: 'kg' | 'opak.' } | null
  function partVolume(doneSets, doneWeight, planSets, planWeight) {
    const reps = doneReps(doneSets, planSets);
    if (!reps) return null;
    let w = parseWeight(doneWeight);
    if (!w || w.choose) {
      const pw = parseWeight(planWeight);
      w = !String(doneWeight || '').trim() && pw && !pw.choose ? pw : null;
    }
    if (w && w.lo > 0) return { value: round2(sum(reps) * w.lo), unit: 'kg' };
    return { value: sum(reps), unit: 'opak.' };
  }

  // Objem cviku po častiach (superset). planned/done = { sets, weight }.
  function volume(name, planned, done) {
    const n = Math.max(1, splitParts(name).length);
    const ds = splitValues(done && done.sets, n, true), dw = splitValues(done && done.weight, n, false);
    const ps = splitValues(planned && planned.sets, n, true), pw = splitValues(planned && planned.weight, n, false);
    return Array.from({ length: n }, (_, i) => partVolume(ds[i], dw[i], ps[i], pw[i]));
  }

  // Súčet objemov v kg (časti v opakovaniach sa nesčítavajú).
  function totalKg(vols) {
    return sum((vols || []).filter((v) => v && v.unit === 'kg').map((v) => v.value));
  }

  // ---------------------------------------------------------------------------
  // Návrh progresie
  // ---------------------------------------------------------------------------
  // Nezvládol klient plánované opakovania (alebo RPE 10)?
  function missedPart(planSets, doneSets, doneRpe) {
    const r = parseRpe(doneRpe);
    if (r && r[1] >= 10) return true;
    const p = parseSets(planSets), d = parseSets(doneSets);
    if (!p || p.ok || !d || d.ok) return false;
    if (d.sets.length < p.sets.length) return true;
    return p.sets.some((s, i) => d.sets[i] && d.sets[i].min < s.min);
  }
  function missed(name, planned, done) {
    if (!hasAny(done)) return false;
    const n = Math.max(1, splitParts(name).length);
    const ps = splitValues(planned.sets, n, true), ds = splitValues(done.sets, n, true), dr = splitValues(done.rpe, n, true);
    return ps.some((_, i) => missedPart(ps[i], ds[i], dr[i]));
  }

  /*
   * Návrh pre jednu časť cviku.
   * in: { plan: { sets, weight, rpe }, done: { sets, weight, rpe }, prevMissed, step, pct }
   * out: { sets, weight, rule, reason, review, base, proposed, alternatives }
   */
  function suggestPart(input) {
    const plan = input.plan, done = input.done;
    const step = input.step > 0 ? input.step : 2.5;
    const pct = input.pct >= 0 ? input.pct : 0.05;
    const planP = parseSets(plan.sets);
    const planW = parseWeight(plan.weight);
    const base = partVolume(done.sets, done.weight, plan.sets, plan.weight);
    const planVol = partVolume(plan.sets, plan.weight, plan.sets, plan.weight);
    const out = (o) => ({ sets: plan.sets, weight: plan.weight, review: false, base, proposed: planVol, alternatives: [], ...o });
    const keep = (rule, reason, review, alternatives) => out({ rule, reason, review: Boolean(review), alternatives: alternatives || [] });

    if (!hasAny(done)) return keep('R1', 'Bez zápisu – ponechané');
    if (planW && planW.choose) {
      const dw = parseWeight(done.weight);
      const bits = [dw && dw.lo ? `minule ${fmtKg(dw.lo)} kg` : '', base ? `objem ${formatVolume(base.value)} ${base.unit}` : ''].filter(Boolean);
      return keep('R2', `Váha podľa seba${bits.length ? ' – ' + bits.join(', ') : ''}`);
    }

    const doneP = parseSets(done.sets);
    if (!planP || planP.ok || !doneP || (doneP.ok && !planP)) return keep('R0', 'Nedá sa vyhodnotiť – skontroluj', true);
    const reps = doneP.ok ? planP.sets.map((s) => s.min) : doneP.sets.map((s) => s.min);

    // Odcvičená váha; chýba -> podľa plánu; ani tam nie je -> vlastná váha.
    let dwP = parseWeight(done.weight);
    if (dwP && dwP.choose) dwP = null;
    if (!dwP && String(done.weight || '').trim()) return keep('R0', 'Nedá sa vyhodnotiť – skontroluj', true);
    if (!dwP && planW && planW.lo > 0) dwP = planW;
    const bodyweight = !dwP || !(dwP.lo > 0);
    const dw = bodyweight ? 0 : dwP.lo;
    const comma = Boolean((planW && planW.comma) || (dwP && dwP.comma));

    const rpeDone = parseRpe(done.rpe);
    const rpePlan = parseRpe(plan.rpe);
    const rpeTxt = (r) => fmtKg(r[0]) + (r[1] > r[0] ? '–' + fmtKg(r[1]) : '');

    // R3: nezvládnuté opakovania alebo RPE 10
    if (missedPart(plan.sets, done.sets, done.rpe)) {
      const why = rpeDone && rpeDone[1] >= 10 ? 'RPE 10' : `nezvládnuté opakovania (${reps.join(', ')} z plánu ${planP.sets.map((s) => s.min).join(', ')})`;
      if (!input.prevMissed) return keep('R3', `${cap(why)} – ponechané; ak sa to zopakuje, navrhne sa ľahšia váha`);
      if (bodyweight || dw - step <= 0 || !planW || !(planW.lo > 0)) return keep('R3', `2× po sebe ${why} – zníž záťaž ručne`, true);
      const weight = planW.hi > planW.lo
        ? `${fmtNum(planW.lo - step, comma)}-${fmtNum(planW.hi - step, comma)}`
        : fmtNum(dw - step, comma);
      const proposed = { value: round2(sum(planP.sets.map((s) => s.min)) * (dw - step)), unit: 'kg' };
      return out({ weight, rule: 'R3', reason: `2× po sebe ${why} → −${fmtKg(step)} kg`, proposed });
    }

    // R4: ťažšie ako plán
    if (rpePlan && rpeDone && rpeDone[1] > rpePlan[1]) {
      return keep('R4', `RPE ${rpeTxt(rpeDone)} nad plánom ${rpeTxt(rpePlan)} → ponechané`);
    }

    // R5 / R6: cieľ objemu
    const easy = rpePlan && rpeDone && rpeDone[1] <= rpePlan[0] - 1;
    const tPct = easy ? pct * 2 : pct;
    const rule = easy ? 'R5' : 'R6';
    const head = easy
      ? `Ľahké (RPE ${rpeTxt(rpeDone)} pri pláne ${rpeTxt(rpePlan)})`
      : `Splnené${rpeDone ? ` pri RPE ${rpeTxt(rpeDone)}` : ''}`;

    const S = planP.sets.length;
    const uniform = planP.sets.every((s) => s.min === planP.sets[0].min && s.max === planP.sets[0].max);
    const isRange = uniform && planP.sets[0].max > planP.sets[0].min;
    const pMin = planP.sets[0].min, pMax = planP.sets[0].max;
    const doneMin = Math.min(...reps);
    // Základ: odcvičené opakovania, nad plán sa nepočítajú (aby sa váha zvyšovala aj vtedy).
    const capReps = reps.map((r, i) => Math.min(r, (planP.sets[i] || planP.sets[planP.sets.length - 1]).max));
    const baseVal = bodyweight ? sum(capReps) : sum(capReps) * dw;
    if (!(baseVal > 0)) return keep('R0', 'Nedá sa vyhodnotiť – skontroluj', true);
    const target = baseVal * (1 + tPct);
    const unit = bodyweight ? 'opak.' : 'kg';

    // Kandidáti: rovnaký počet sérií; váha +0/+1/+2 kroky; opakovania v rozsahu plánu.
    const cands = [];
    const add = (k, r, list) => {
      const w = bodyweight ? 0 : dw + k * step;
      const repsSum = list ? sum(list) : S * r;
      cands.push({ k, r, value: round2(bodyweight ? repsSum : repsSum * w), w });
    };
    if (bodyweight) {
      if (uniform) for (let r = Math.max(doneMin, pMin); r <= Math.max(doneMin, pMin) + 5; r++) add(0, r);
    } else {
      for (let k = 0; k <= 2; k++) {
        if (uniform) {
          for (let r = pMin; r <= pMax; r++) if (k > 0 || r >= Math.min(doneMin, pMax)) add(k, r);
        } else add(k, null, planP.sets.map((s) => s.min));
      }
    }
    const capPct = Math.max(2 * tPct, tPct + 0.05);
    const ok = cands.filter((c) => c.value >= target - 1e-9).sort((a, b) => a.value - b.value || a.k - b.k);
    const best = ok[0] && ok[0].value / baseVal - 1 <= capPct + 1e-9 ? ok[0] : null;

    const weightFor = (k) => {
      if (bodyweight) return plan.weight;
      if (k === 0) {
        const inPlan = planW && planW.lo > 0 && dw >= planW.lo && dw <= planW.hi;
        return inPlan ? plan.weight : fmtNum(dw, comma);
      }
      if (planW && planW.hi > planW.lo) return `${fmtNum(planW.lo + k * step, comma)}-${fmtNum(planW.hi + k * step, comma)}`;
      return fmtNum(dw + k * step, comma);
    };
    const setsFor = (c) => {
      if (bodyweight && uniform && !isRange) return formatSets(S, c.r, null, planP.extra);
      return plan.sets; // rozsah alebo nerovnomerné série ostávajú, ako ich napísal tréner
    };
    const describe = (c) => {
      const bits = [];
      if (c.k > 0) bits.push(`+${fmtKg(c.k * step)} kg`);
      if (bodyweight && c.r != null) bits.push(`${S}×${c.r}`);
      else if (isRange) bits.push(`cieľ ${S}×${c.r} opak.`);
      return bits.join(', ') || 'rovnako';
    };

    // Alternatívy: ďalší kandidát, +1 opakovanie, +1 séria
    const alts = [];
    const pushAlt = (label, sets, weight, value) => {
      if (alts.some((a) => a.sets === sets && a.weight === weight)) return;
      alts.push({ label, sets, weight, value: round2(value), pct: value / baseVal - 1, unit });
    };
    for (const c of ok) {
      if (best && c === best) continue;
      if (c.value / baseVal - 1 > 0.25) break;
      pushAlt(describe(c), setsFor(c), weightFor(c.k), c.value);
      break;
    }
    if (uniform && !isRange) {
      const r1 = Math.max(doneMin, pMin) + 1;
      pushAlt('+1 opak.', formatSets(S, r1, null, planP.extra), weightFor(0), bodyweight ? S * r1 : S * r1 * dw);
    }
    if (uniform) {
      const rr = isRange ? Math.min(Math.max(doneMin, pMin), pMax) : Math.max(doneMin, pMin);
      pushAlt('+1 séria', formatSets(S + 1, pMin, isRange ? pMax : pMin, planP.extra), weightFor(0), bodyweight ? (S + 1) * rr : (S + 1) * rr * dw);
    }

    const baseObj = { value: round2(baseVal), unit };
    if (!best) {
      const first = ok[0];
      const why = first
        ? `najmenšie zvýšenie je ${formatPct(first.value / baseVal - 1)} (cieľ ${formatPct(tPct)})`
        : `cieľ ${formatPct(tPct)} sa v rozsahu plánu nedá dosiahnuť`;
      return keep(rule, `${head}, ale ${why} – vyber alternatívu`, true, alts.filter((a) => !(a.sets === plan.sets && a.weight === plan.weight)));
    }
    const sets = setsFor(best);
    const weight = weightFor(best.k);
    const proposed = { value: best.value, unit };
    const reason = `${head} → cieľ ${formatPct(tPct)} objemu: ${describe(best)}`;
    return out({ sets, weight, rule, reason, base: baseObj, proposed, alternatives: alts.filter((a) => !(a.sets === sets && a.weight === weight)) });
  }

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  /*
   * Návrh pre celý cvik (aj superset).
   * ex: { name, planned: { sets, weight, rpe, note }, done: {...}, prevMissed, step, pct }
   * out: { fields: { sets, weight, rpe, note }, rule, reason, review, parts: [{ name, base, proposed }], alternatives }
   */
  function suggest(ex) {
    const parts = splitParts(ex.name);
    const n = Math.max(1, parts.length);
    const planned = ex.planned || {}, done = ex.done || {};
    if (n === 1) {
      const r = suggestPart({ plan: planned, done, prevMissed: ex.prevMissed, step: ex.step, pct: ex.pct });
      return {
        fields: { sets: r.sets, weight: r.weight, rpe: planned.rpe || '', note: planned.note || '' },
        rule: r.rule, reason: r.reason, review: r.review,
        parts: [{ name: ex.name, base: r.base, proposed: r.proposed }],
        alternatives: r.alternatives.map((a) => ({ ...a, fields: { sets: a.sets, weight: a.weight } })),
      };
    }
    const ps = splitValues(planned.sets, n, true), pw = splitValues(planned.weight, n, false), pr = splitValues(planned.rpe, n, true);
    const ds = splitValues(done.sets, n, true), dw = splitValues(done.weight, n, false), dr = splitValues(done.rpe, n, true);
    const res = parts.map((p, i) => suggestPart({
      plan: { sets: ps[i], weight: pw[i], rpe: pr[i] },
      done: { sets: ds[i], weight: dw[i], rpe: dr[i] },
      prevMissed: ex.prevMissed, step: ex.step, pct: ex.pct,
    }));
    const joinVals = (vals, orig, origVals) => {
      if (vals.every((v, i) => v === origVals[i])) return orig || '';
      const trimmed = vals.slice();
      while (trimmed.length > 1 && !trimmed[trimmed.length - 1]) trimmed.pop();
      return trimmed.join(' a ');
    };
    const order = ['R0', 'R3', 'R4', 'R1', 'R2', 'R6', 'R5'];
    const rule = res.map((r) => r.rule).sort((a, b) => order.indexOf(a) - order.indexOf(b))[0];
    return {
      fields: {
        sets: joinVals(res.map((r) => r.sets), planned.sets, ps),
        weight: joinVals(res.map((r) => r.weight), planned.weight, pw),
        rpe: planned.rpe || '',
        note: planned.note || '',
      },
      rule,
      reason: res.map((r, i) => `${cap(parts[i].toLowerCase())}: ${r.reason}`).join(' · '),
      review: res.some((r) => r.review),
      parts: res.map((r, i) => ({ name: parts[i], base: r.base, proposed: r.proposed })),
      alternatives: [],
    };
  }

  const api = {
    splitParts, splitValues, parseSets, parseRpe, parseWeight, hasAny,
    volume, totalKg, missed, suggest, suggestPart,
    formatVolume, formatPct, formatSets, fmtKg,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.FitkoCalc = api;
})(this);
</script>
<script>
(function () {

  var kg = function (n) { return String(Math.round(n * 100) / 100).replace('.', ','); };
  var cap = function (s) { s = String(s || '').toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); };
  var nice = function (name) { return C.splitParts(name).map(cap).join(' + '); };
  var prettySets = function (s) { return String(s || '').replace(/\s*[xX×]\s*/g, '×'); };

  var ROWS = [

    { day: 3, name: 'LAT PULLDOWN', w: { 1: [P('3x10', '55', '8'), P('3x10', '55', '7.5')], 2: [P('3x10', '57.5', '8'), P('3x10', '57.5', '8')], 3: [P('3x10', '60', '8'), P('3x10', '60', '7.5')], 4: [P('3x10', '62.5', '8'), null] } },
    { day: 3, name: 'SEATED ROW', w: { 1: [P('3x10', '50', '8'), P('3x10', '50', '7')], 2: [P('3x10', '52.5', '8'), P('3x10', '52.5', '7.5')], 3: [P('3x10', '55', '8', 'lakte k telu'), P('3x10', '55', '8')], 4: [P('3x10', '57.5', '8'), null] } },
    { day: 3, name: 'BICEPS CURL', w: { 1: [P('3x12', '12', '8'), P('3x12', '12', '8')], 2: [P('3x12', '12', '8'), P('3x12', '12', '8')], 3: [P('3x12', '14', '8'), P('12, 10, 9', '14', '9.5')], 4: [P('3x12', '14', '8'), null] } },
  ];
  ROWS.forEach(function (r, i) { r.id = 'r' + i; });
  var BODY = [85.6, 85.4, 85.5, 85.2, 85.3, 85.0, 84.9, 85.1, 84.8, 84.9, 84.7, 84.6, 84.8, 84.5, 84.4, 84.6, 84.3, 84.4, 84.2];
  var CLIENTS = [
    { id: 'me', name: 'Marián', block: 'COMEBACK NOV', last: 'dnes ráno váha · tréning v stredu' },
    { id: 'p', name: 'Peter K.', block: 'HYPERTROFIA 2', last: 'tréning včera', demo: true, flags: [['up', '↑ 9 cvikov hore'], ['', 'všetko podľa plánu']], done: '3/4' },
    { id: 'j', name: 'Jana M.', block: 'SILA 1', last: 'pred 6 dňami', demo: true, flags: [['warn', '6 dní bez tréningu'], ['down', '↓ 2 cviky klesajú']], done: '0/3' },
  ];

  // ---------------- Stav ----------------
  var LS = 'fitko.proto.panel';
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { saved = null; }
  var state = { view: 'clients', focus: null, draft: saved && saved.draft || null, sent: saved && saved.sent || null, metric: 'kg' };
  function persist() { try { localStorage.setItem(LS, JSON.stringify({ draft: state.draft, sent: state.sent })); } catch (e) {} }

  // ---------------- Výpočty ----------------
  function cellOf(r, n) { var c = r.w[n]; return c ? { p: c[0], d: c[1] } : null; }
  function vol(r, n) { var c = cellOf(r, n); if (!c || !c.d) return 0; return C.totalKg(C.volume(r.name, c.p, c.d)); }
  function wNum(s) { var w = C.parseWeight(String(s || '').split(/\s+a\s+/)[0]); return w && w.lo ? w.lo : 0; }
  function doneWeeks(r) { return WEEKS.filter(function (w) { var c = cellOf(r, w.n); return c && c.d; }).map(function (w) { return w.n; }); }
  function rowTrend(r) {
    var ns = doneWeeks(r); var v = ns.map(function (n) { return vol(r, n); });
    var out = { kind: 'same', label: '→ stagnuje', why: '' };
    if (v.length < 2) return { kind: 'same', label: '–', why: '' };
    var last = v[v.length - 1], prev = v[v.length - 2];
    var lastC = cellOf(r, ns[ns.length - 1]);
    if (C.missed(r.name, lastC.p, lastC.d) || last < prev * 0.95) return { kind: 'down', label: '↓ klesá', why: C.missed(r.name, lastC.p, lastC.d) ? 'nezvládnuté opakovania' : 'nižší objem' };
    var l3 = v.slice(-3);

      if (wNum(a.weight) === wNum(c.weight) && wNum(b.weight) === wNum(c.weight) && ra < rb && rb < rc) out.fatigue = true;
    }

  }
  function insights() {

      var t = rowTrend(r);

    });

  }
  function weekVol(n) { return ROWS.reduce(function (a, r) { return a + vol(r, n); }, 0); }

  // Návrh nového týždňa z výkonov (rovnaké pravidlá ako v ostrej apke – calc.js).

      var s = C.suggest({ name: r.name, planned: c4.p, done: src ? src.d : {}, prevMissed: prev ? C.missed(r.name, prev.p, prev.d) : false, step: r.name === 'INCLINE DB PRESS' || r.name === 'BICEPS CURL' ? 2 : 2.5, pct: 0.05 });
      vals[r.id] = { sets: s.fields.sets, weight: s.fields.weight, rpe: s.fields.rpe, note: s.fields.note, why: s.reason, rule: s.rule, review: s.review };
    });
    return { n: 5, mode: mode, vals: vals, edited: {}, extra: [] };
  }

      case 'addex': state.draft.extra.push({ id: 'x' + Date.now(), day: Number(t.dataset.day), name: '', sets: '3x10', weight: '', rpe: '8' }); persist(); render();
        var inp = document.querySelector('[data-in="exname"][data-x="' + state.draft.extra[state.draft.extra.length - 1].id + '"]'); if (inp) inp.focus(); break;

  render();
})();
