<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fitko">
  <title>Fitko</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="app.css">
  <link rel="preload" href="fonts/barlow-800i-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toast" role="status"></div>
  <!-- Výber fotiek je mimo #app, aby ho neprerušilo prekreslenie obrazovky. -->
  <input type="file" id="photo-camera" accept="image/*" capture="environment" data-photo-input hidden>
  <input type="file" id="photo-gallery" accept="image/*" multiple data-photo-input hidden>
  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
